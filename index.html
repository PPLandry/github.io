<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stations de déchargement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      padding: 0 0 0.75rem 0;
      border-bottom: 2px solid #e2e8f0;
      text-align: left;
    }

    th:last-child {
      text-align: right;
    }

    td {
      padding: 0.85rem 0;
      border-bottom: 1px solid #f1f5f9;
      word-break: break-word;
      vertical-align: baseline;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .param-key {
      font-weight: 600;
      color: #334155;
      padding-right: 1rem;
    }

    .param-value {
      color: #0f172a;
      text-align: right;
    }

    .empty-message {
      color: #64748b;
      font-style: italic;
      text-align: center;
      padding: 1.5rem 0;
    }

    .actions {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2e8f0;
      text-align: right;
    }

    .print-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .print-btn:hover {
      background-color: #1d4ed8;
    }

    .print-btn:active {
      background-color: #1e40af;
    }

    /* Clean styling when printing */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }

      .card {
        box-shadow: none;
        max-width: 100%;
        padding: 0;
      }

      .actions {
        display: none;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>stations de déchargement</h1>

    <table>
      <thead>
        <tr>
          <th>Matière</th>
          <th>Station</th>
        </tr>
      </thead>
      <tbody id="params-body"></tbody>
    </table>

    <div class="actions">
      <button type="button" class="print-btn" onclick="window.print()">Imprimer</button>
    </div>
  </main>

  <script>
    const paramsBody = document.getElementById("params-body");

    function renderEntries(entries) {
      paramsBody.replaceChildren();

      if (entries.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 2;
        td.className = "empty-message";
        td.textContent = "Aucune information disponible dans l'URL.";
        tr.appendChild(td);
        paramsBody.appendChild(tr);
        return;
      }

      for (const [key, value] of entries) {
        const tr = document.createElement("tr");

        const keyTd = document.createElement("td");
        keyTd.className = "param-key";
        keyTd.textContent = key;

        const valueTd = document.createElement("td");
        valueTd.className = "param-value";
        valueTd.textContent = value || "—";

        tr.appendChild(keyTd);
        tr.appendChild(valueTd);
        paramsBody.appendChild(tr);
      }
    }

    if (typeof google !== "undefined" && google.script && google.script.url) {
      google.script.url.getLocation(function(location) {
        const entries = [];
        for (const [key, values] of Object.entries(location.parameters || {})) {
          for (const val of values) {
            entries.push([key, val]);
          }
        }
        renderEntries(entries);
      });
    } else {
      const params = new URLSearchParams(window.location.search);
      renderEntries(Array.from(params.entries()));
    }
  </script>

</body>
</html>
