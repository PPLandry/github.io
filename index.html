<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="A simple personal website published with GitHub Pages.">
  <title>PPLandry — Home</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f7f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 8vw, 4.5rem);
      background: #fff;
      border: 1px solid #e7eaf2;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgb(23 32 51 / 8%);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #5368d8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.06em;
    }

    .intro {
      max-width: 46ch;
      margin: 1.5rem 0 0;
      color: #5b6475;
      font-size: 1.125rem;
      line-height: 1.7;
    }

    .note {
      margin: 2rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid #e7eaf2;
      color: #7a8291;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal website</p>
    <h1>Hello, world.</h1>
    <p class="intro">Welcome to my corner of the web. This site is just getting started—check back soon for more.</p>
    <p class="note">Made with care and published on GitHub Pages.</p>
  </main>
</body>
</html>
